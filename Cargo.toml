[package]
name = "veritas-cache"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
hdrhistogram = "7"
hnsw_rs = "0.3.4"
ort = "2.0.0-rc.12"
rand = "0.8"
rand_chacha = "0.3"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = "0.23.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
